server:
  port: 8081

spring:
  application:
    name: tablepulse-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/tablepulse_db}
    username: ${SPRING_DATASOURCE_USERNAME:tablepulse_user}
    password: ${SPRING_DATASOURCE_PASSWORD:tablepulse123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

app:
  jwt:
    # NEVER commit a real secret here. Production MUST set APP_JWT_SECRET
    # to a random 32+ char string. The default below is dev-only.
    secret: ${APP_JWT_SECRET:dev-only-change-me-in-production-0123456789ABCDEF}
    expiration-seconds: ${APP_JWT_EXPIRATION:86400}
  upload-dir: ${APP_UPLOAD_DIR:uploads}
  public-base-url: ${APP_PUBLIC_BASE_URL:https://tablepulse.in}
